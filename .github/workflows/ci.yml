name: CI

on:
  # By hand: Actions tab, CI, Run workflow; and every push to the outputs
  # branch of this fork (Endprodukt/xemu-chihiro-outputs).
  workflow_dispatch:
  push:
    branches:
      - outputs
  # pull_request:
  # push:
  #   branches-ignore:
  #     - master
  #   tags-ignore:
  #     - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.ref }}
